[avito]
tg_token = ""
tg_chat_id = []
vk_token = ""
vk_user_id = []

# ==============================================================================
# Поля ниже подгружаются из основного .env проекта:
#   - urls:             $AVITO_URLS (или $AVITO_URL)
#   - use_bypass_api:   $AVITO_USE_BYPASS_API
#   - cookies_api_key:  $AVITO_COOKIES_API_KEY
#   - proxy_string:     $AVITO_PROXY_STRING
#   - count:            $AVITO_COUNT
# ==============================================================================
urls = [
    "${AVITO_URLS:-https://www.avito.ru/moskva/kvartiry/sdam/na_dlitelnyy_srok-ASgBAgICAkSSA8gQ8AeQUg?cd=2&context=H4sIAAAAAAAA_wEmANn_YToxOntzOjE6InkiO3M6MTY6InRCTlVOYnNSbTFNZklYdlQiO30ID_1RJgAAAA&localPriority=0}",
]
one_time_start = false

use_bypass_api = "${AVITO_USE_BYPASS_API:-true}"
cookies_api_key = "${AVITO_COOKIES_API_KEY:-}"

proxy_string = "${AVITO_PROXY_STRING:-}"

count = "${AVITO_COUNT:-10}"
save_xlsx = false

keys_word_white_list = []
keys_word_black_list = []
seller_black_list = []
max_price = 99999999
min_price = 0
geo = ""
proxy_change_url = ""
pause_general = 1
pause_between_links = 1
max_age = 0
max_count_of_retry = 5
ignore_reserv = true
ignore_promotion = false
one_file_for_link = false
parse_views = false
use_webdriver = false
use_own_cookies = false
parse_phone = false
proxy_notifier = ""
tg_only_text = false
retry_delay = 5
timeout = 20
block_threshold = 3
